name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # The same flows against a real IMAP server (Dovecot), which the in-memory test server can't stand in
  # for: MOVE and UIDPLUS answers, special-use folders, IDLE.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start Dovecot
        run: |
          docker build -q -t rubi-dovecot testdata
          docker run -d --name dovecot -p 127.0.0.1:1143:143 rubi-dovecot
          for i in $(seq 1 30); do nc -z 127.0.0.1 1143 && break; sleep 1; done
      - run: go test -race -tags integration -run Real -count=1 ./...
        env:
          MAILKIT_IMAP: 127.0.0.1:1143
      - if: failure()
        run: docker logs dovecot
